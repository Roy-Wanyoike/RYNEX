name: RYNEX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type-check & build services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/vehicles-api, services/notifications-service]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm ci || npm install

      - name: Type-check (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Build (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npx tsc

  web-build:
    name: Type-check web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci || npm install
      - name: Compile TypeScript (in place)
        working-directory: apps/web
        run: npx tsc

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          ! grep -rInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' \
            --include='*.ts' --include='*.js' --include='*.json' --include='*.md' \
            --include='*.yml' --include='*.sql' --include='*.html' .
          echo "No secrets found."
