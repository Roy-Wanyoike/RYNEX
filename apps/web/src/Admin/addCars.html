<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Box icons -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="admin.css">

    <title>Add Cars — Admin Dashboard</title>

    <style>
        /* Page-local styling for the car catalogue table (admin.css is shared,
           so additions for this page live here). */
        #content main .table-data .order table th,
        #content main .table-data .order table td {
            text-align: left;
            vertical-align: middle;
        }

        #carList button.remove {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        #carList button.remove:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #carList td.empty {
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>

<body>


    <!-- SIDEBAR -->
    <section id="sidebar">
        <a href="#" class="brand">
            <span class="text">Admin Dashboard</span>
        </a>
        <ul class="side-menu top">
            <li class="active">
                <a href="admin.html">
                    <i class='bx bxs-dashboard'></i>
                    <span class="text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="addCars.html">
                    <i class='bx bxs-shopping-bag-alt'></i>
                    <span class="text">Add Cars</span>
                </a>
            </li>
            <li>
                <a href="addUser.html" target="_self">
                    <i class='bx bxs-doughnut-chart'></i>
                    <span class="text">Add users</span>
                </a>
            </li>
            <li>
                <a href="../Admin/order.html">
                    <i class='bx bxs-message-dots'></i>
                    <span class="text">Orders</span>
                </a>
            </li>

        </ul>
    </section>

    <section id="content">

        <nav>
            <i class='bx bx-menu' style="color: white;"></i>

            <form action="#">
                <div class="form-input">
                    <input type="search" id="searchCars" placeholder="Search...">
                    <button type="submit" class="search-btn"><i class='bx bx-search'></i></button>
                </div>
            </form>

        </nav>

        <main>
            <div class="addUser" id="adminCarsPanel">
                <h2>Add Cars</h2> <br>

                <!-- Add-car form: ids match the POST /products contract
                     (model, bodyType, brand, prices, pictureUrl).
                     novalidate keeps validation in addCars.js so errors render
                     via ui.showFormError. -->
                <form action="#" class="row" id="formCars" novalidate>
                    <div class="column">
                        <label for="model">Car Model</label>
                        <input type="text" id="model" name="model" placeholder="e.g. Mazda MX-5" autocomplete="off">

                        <label for="bodyType">Body Type</label>
                        <input type="text" id="bodyType" name="bodyType" placeholder="e.g. Sedan" autocomplete="off">

                        <label for="brand">Brand</label>
                        <input type="text" id="brand" name="brand" placeholder="e.g. Mazda" autocomplete="off">

                        <label for="prices">Price</label>
                        <input type="number" id="prices" name="prices" step="0.01" min="0.01" placeholder="e.g. 2500000"
                            autocomplete="off">

                        <label for="pictureUrl">Picture URL</label>
                        <input type="text" id="pictureUrl" name="pictureUrl"
                            placeholder="https://example.com/car.jpg" autocomplete="off">
                    </div>

                    <button type="submit" class="reg" id="addCarBtn">Add Car</button>
                </form>

                <!-- Car catalogue: rendered by addCars.js into #carListBody -->
                <div class="table-data">
                    <div class="order">
                        <div class="head">
                            <h3>Car Catalogue</h3>
                        </div>
                        <table id="carList">
                            <thead>
                                <tr>
                                    <th>Model</th>
                                    <th>Brand</th>
                                    <th>Body Type</th>
                                    <th>Price</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>
                            <tbody id="carListBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <!-- Load order matters: api.js -> ui.js -> page script -->
    <script src="../api/api.js"></script>
    <script src="../api/ui.js"></script>
    <script src="./addCars.js"></script>
</body>
</html>
