<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | RYNEX</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <h1>REGISTRATION</h1>

    <form action="" class="row" id="registrationForm" novalidate>
        <div class="column">
            <label for="userName">Username</label>
            <input type="text" id="userName" name="userName" autocomplete="username" placeholder="e.g. john_doe">

            <label for="phoneNo">Phone number</label>
            <input type="text" id="phoneNo" name="phoneNo" autocomplete="tel" placeholder="e.g. +254 700 000 000">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Enter a strong password">
            <p class="hint">Use 8+ characters with an uppercase letter, a lowercase letter, a number and a special character (!@#$%^&amp;*).</p>

            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password">

            <label for="address">Address</label>
            <input type="text" id="address" name="address" autocomplete="street-address" placeholder="Street, city">
        </div>

        <div class="column">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="First and last name">

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">

            <label for="country">Country</label>
            <input type="text" id="country" name="country" autocomplete="country-name" placeholder="e.g. Kenya">
        </div>

        <button class="reg" id="registerBtn" type="submit">REGISTER</button>
    </form>

    <p>Have an account? <a href="../login/login.html">Log in</a></p>

    <script src="../api/api.js"></script>
    <script src="../api/ui.js"></script>
    <script src="./registration.js"></script>
</body>
</html>
